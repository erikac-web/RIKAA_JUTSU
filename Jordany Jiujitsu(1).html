<!DOCTYPE html>
<html lang="pt-BR" style=""><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jordany Jiujitsu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@400;500;700&amp;display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--r:#e11d2e;--k:#0a0a0a;--k2:#171717;--k3:#2a2a2a;--w:#f4f4f4;--g:#a3a3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--k);scroll-behavior:smooth}
body{margin:0;background:var(--k);color:var(--w);font:400 1rem/1.55 "DM Sans",system-ui,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:"Bebas Neue","DM Sans",sans-serif;font-weight:400;letter-spacing:.04em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--r);outline-offset:3px}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:radial-gradient(circle at 50% 38%,#4a0b13,var(--k) 72%)}
#leao{width:min(88vw,420px);height:min(44vh,420px)}
.hero h1{font-size:clamp(3rem,15vw,7rem);line-height:.9;text-shadow:0 4px 30px #000}
.hero h1 b{color:var(--r);font-weight:400}
.down{margin-top:22px;background:none;border:2px solid var(--r);border-radius:99px;padding:10px 22px;animation:pul 1.6s infinite}
@keyframes pul{50%{transform:translateY(6px)}}
.car{padding:56px 0 40px;text-align:center;overflow:hidden}
.car h2,.pg h2{font-size:2.4rem}
.stage{perspective:1100px;height:330px;display:grid;place-items:center}
.ring{position:relative;width:200px;height:260px;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.sl{position:absolute;inset:0;border-radius:16px;overflow:hidden;border:2px solid var(--k3);background:linear-gradient(160deg,#3a0a10,#111);display:grid;place-items:center;transition:transform .9s cubic-bezier(.2,.8,.2,1),box-shadow .5s;cursor:pointer}
.sl img{width:100%;height:100%;object-fit:cover}
.sl span{font-size:3rem}.sl small{display:block;font-size:.8rem;color:var(--g)}
.sl.sel{border-color:var(--r);box-shadow:0 0 44px #e11d2e99,0 36px 40px #000c}
.ctl{display:flex;gap:16px;justify-content:center;margin:8px 0}
.ctl button{width:52px;height:52px;border-radius:50%;border:2px solid var(--r);background:var(--k2);font-size:1.6rem}
.valor{margin:22px 0 4px;color:var(--g)}.valor b{display:block;font:400 3rem "Bebas Neue",sans-serif;color:var(--w)}
.cta{display:block;width:100%;text-align:center;background:var(--r);color:#fff;border:0;border-radius:12px;padding:15px;font-weight:700;text-decoration:none;margin:12px 0;box-shadow:0 8px 24px #e11d2e55}
.car .cta{max-width:340px;margin:12px auto}
.ghost{display:block;width:100%;text-align:center;background:transparent;border:2px solid var(--r);border-radius:12px;padding:13px;margin:10px 0;text-decoration:none;color:var(--w)}
.pg{max-width:560px;margin:0 auto;padding:28px 20px}
.lead,.aviso{color:var(--g)}.aviso{font-size:.9rem}
label{display:grid;gap:4px;margin:12px 0;font-weight:500}
input,select,textarea{background:var(--k2);border:2px solid var(--k3);border-radius:10px;padding:12px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--r)}
.err{color:#ff7b86;min-height:1.4em}.ok{color:#6ee7a0}
.perf{text-align:center}.perf h2{font-size:2.4rem}
.av{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid var(--r);display:grid;place-items:center;font-size:3rem;background:var(--k2);margin:0 auto 10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
.tiles button{background:var(--k2);border:2px solid var(--k3);border-radius:16px;padding:18px 10px;font-size:1.8rem;display:grid;gap:6px;justify-items:center}
.tiles button:hover{border-color:var(--r)}.tiles b{font-size:.9rem;font-weight:500}
#fc{width:220px;height:220px;border-radius:50%;border:3px solid var(--r);display:block;margin:16px auto}
.pix{background:var(--k2);border:2px dashed var(--r);border-radius:14px;padding:14px;margin:14px 0;text-align:center}
.pix code{display:block;word-break:break-all;margin:6px 0;font-size:1.05rem}
.done{background:#0f2a1a;border:2px solid #2f9e5f;border-radius:16px;padding:18px;text-align:center;font-size:2rem;animation:pop .6s}
.done b{display:block;font-size:1.3rem}.done span{display:block;font-size:.95rem;color:#b6e8c9}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.hs{padding-left:18px}.nt{background:var(--k2);border-radius:14px;padding:14px;margin:16px 0}
.nt div{display:flex;gap:10px;margin:8px 0}.nt button{flex:1;border:2px solid var(--k3);background:transparent;border-radius:10px;padding:10px}
.nt button.on{background:var(--r);border-color:var(--r)}
.comp{background:var(--k2);border-left:4px solid var(--r);border-radius:10px;padding:12px 16px}
.cd{background:var(--k2);border:2px solid var(--k3);border-radius:16px;padding:16px;margin:18px 0}
.bar{height:16px;background:var(--k3);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--r);transition:width 1s}
.al{display:block;width:100%;text-align:left;background:var(--k);border:2px solid var(--k3);border-radius:10px;padding:12px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0d0d0df2;border-top:2px solid var(--r);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:10px 4px;display:grid;justify-items:center;font-size:1.3rem;color:var(--g)}
nav button.on{color:#fff}nav b{font-size:.72rem;font-weight:500}
.ban{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;z-index:50;background:var(--r);color:#fff;padding:16px 18px;border-radius:14px;font:400 1.7rem "Bebas Neue",sans-serif;display:flex;justify-content:space-between;align-items:center;animation:pop .4s}
.ban button{background:none;border:0;color:#fff;font-size:1.6rem}
.wel{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#5a0d17,#000 75%);display:grid;place-content:center;justify-items:center;text-align:center;padding:24px;overflow:hidden}
.wel>*{position:relative}.wel .kim{font-size:6rem;animation:quica 1.2s infinite}.wel h2{font-size:3rem}.wel p{max-width:320px;color:#ddd}
@keyframes quica{50%{transform:translateY(-18px) rotate(-8deg)}}
.dots{position:absolute!important;inset:0;pointer-events:none}
.dots i{position:absolute;top:-20px;width:8px;height:14px;background:var(--r);animation:cai 3.2s linear infinite}
@keyframes cai{to{transform:translateY(110vh) rotate(540deg)}}
.yr{display:flex;align-items:center;justify-content:center;gap:18px;font:400 2.4rem "Bebas Neue",sans-serif;margin:8px 0}
.yr button{width:44px;height:44px;border-radius:50%;border:2px solid var(--r);background:var(--k2);font-size:1.5rem}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin:18px 0}
.mes{background:var(--k2);border:2px solid var(--k3);border-radius:14px;padding:10px}.mes h3{text-align:center;color:var(--r)}
.sem,.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}.sem span{font-size:.7rem;color:var(--g)}
.dias button{aspect-ratio:1;border:0;border-radius:8px;background:transparent;font-size:.8rem;padding:0;position:relative}
.dias button.hj{border:1px solid var(--r)}.dias button.sel{background:var(--r)}
.dias button.has::after{content:"";position:absolute;bottom:2px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#6ee7a0}
.lc{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--k3)}.lc span{flex:1;min-width:0}
.lc button{border:2px solid var(--k3);background:transparent;border-radius:10px;padding:8px 10px;font-size:.85rem}
.lc button.on{background:#1f7a4a;border-color:#1f7a4a}.lc button.off{background:var(--r);border-color:var(--r)}
.logo{width:min(84vw,430px);max-height:68vh;object-fit:contain;filter:drop-shadow(0 14px 40px #000b);animation:flut 4s ease-in-out infinite}
@keyframes flut{50%{transform:translateY(-10px)}}
.ph{font-size:2rem;margin:26px 0 10px}
.parc{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;max-width:560px;margin:0 auto 6px;padding:0 20px}
.parc a,.parc div{background:var(--k2);border:2px solid var(--k3);border-radius:14px;padding:14px 10px;text-decoration:none;color:var(--w);display:grid;gap:4px;justify-items:center;font-size:1.6rem}
.parc b{font-size:.9rem;font-weight:700}
.ctrl{width:100%;border-collapse:collapse;margin:12px 0;font-size:.9rem}.ctrl th,.ctrl td{border:1px solid var(--k3);padding:6px 8px;text-align:left}.ctrl th{background:var(--r)}
.lc a{border:2px solid var(--r);background:var(--r);border-radius:10px;padding:8px 10px;font-size:.85rem;text-decoration:none;color:#fff}
.rm{display:flex;gap:8px;align-items:center;font-weight:400}.rm input{width:auto}
.parc img{width:100%;max-height:70px;object-fit:contain;border-radius:8px}
.tiles button small{display:block;color:var(--g);font-size:.72rem;font-weight:400}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function niver(){

function leao(){

  s.add(new T.AmbientLight(0xffffff, .65)); var pl = new T.PointLight(0xff4444, 1.3); pl.position.set(5, 5, 8); s.add(pl);
  var g = new T.Group(); s.add(g);
  function mt(col){ return new T.MeshStandardMaterial({color:col, roughness:.7}); }
  function add(geo, col, x, y, z, sx, sy, sz){ var o = new T.Mesh(geo, mt(col)); o.position.set(x, y, z); o.scale.set(sx, sy, sz); g.add(o); }
  for (var l = 0; l < 2; l++) for (var i = 0; i < 20; i++){ var a = i/20*Math.PI*2 + l*.15, R = 2.1 + l*.35, k = new T.Mesh(new T.ConeGeometry(.6, 1.7 + l*.4, 8), mt(l ? 0x5c0a12 : 0x9b111e)); k.position.set(Math.cos(a)*R, Math.sin(a)*R, -.4 - l*.3); k.rotation.z = a - Math.PI/2; g.add(k); }
  var S = new T.SphereGeometry(1, 24, 24);
  add(S, 0xd98b2b, 0, 0, 0, 1.7, 1.7, 1.5); add(S, 0xf1c27d, 0, -.55, 1.1, .9, .65, .7); add(S, 0x111111, 0, -.15, 1.75, .28, .2, .2);
  [-1, 1].forEach(function(x){ add(S, 0xffffff, x*.65, .45, 1.25, .28, .28, .2); add(S, 0x111111, x*.65, .45, 1.45, .12, .14, .08); add(S, 0xd98b2b, x*1.35, 1.35, .1, .45, .45, .3); });
  var tx = 0, ty = 0;
  if (!window._lp){ window._lp = 1; addEventListener("pointermove", function(e){ tx = (e.clientX/innerWidth - .5)*1.2; ty = (e.clientY/innerHeight - .5)*.8; }); }
  (function loop(t){ if ($("leao") !== c) return; g.rotation.y += ((Math.sin(t/900)*.35 + tx) - g.rotation.y)*.06; g.rotation.x += (ty - g.rotation.x)*.06; g.position.y = Math.sin(t/700)*.12; r.render(s, cam); requestAnimationFrame(loop); })(0);
}
